[project]
name = "hearth-backend"
version = "0.1.0"
description = "Hearth backend: monitoring core, local API, simulator and evaluation"
requires-python = ">=3.11"
dependencies = [
    "hearth-schema>=1,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
face-demo = ["opencv-python>=4.10,<5", "pillow>=10,<13", "cryptography>=43,<47"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
vision = ["ultralytics>=8.3,<9", "opencv-python>=4.10,<5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hearth*"]

[tool.setuptools.package-data]
"hearth.monitor" = ["config.json"]
"hearth.api" = ["static/*"]
"hearth.perception" = ["model.json", "hand_model.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
