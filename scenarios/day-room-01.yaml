scenario_id: day-room-01
title: Day room, one resident falls while others carry on
description: >
  Four residents in a shared day room. One reads in a chair, one walks along the back
  wall (passing behind the others), one walks in and falls near the middle of the room,
  and one gets up from the couch and bends down beside the fallen resident to help.
  Exactly one possible-fall alert is expected, for p3. The helper's bend is a
  false-alarm risk.
