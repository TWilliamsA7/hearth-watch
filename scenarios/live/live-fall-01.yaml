# Live engine: four residents going about their day; one trips at 100 s, in the camera's view,
# and gets up after 40 s. A demo of detection, chosen because the fall is clearly visible:
# across seeds, the shipped monitor thresholds detect far fewer live falls (see docs).
title: Live day room, one fall in view
seed: 8
duration: 180
spec:
  actors: 4
  room: {width: 6.5, depth: 5.5}
  incidents:
    - {kind: fall, t: 100, duration: 40}
