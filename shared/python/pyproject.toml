[project]
name = "hearth-schema"
version = "1.0.0"
description = "Hearth shared event contract (Pydantic models)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hearth_schema"]
